<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Medical Chatbot</title>

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
    >

    <link
        rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">

                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <div class="img_cont">
                                <img
                                    src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                    class="rounded-circle user_img"
                                    alt="Medical assistant"
                                >

                                <span class="online_icon"></span>
                            </div>

                            <div class="user_info">
                                <span>Medical Chatbot</span>
                                <p>General medical information only</p>
                            </div>
                        </div>
                    </div>

                    <div
                        id="messageFormeight"
                        class="card-body msg_card_body"
                    ></div>

                    <div class="card-footer">
                        <form
                            id="messageArea"
                            class="input-group"
                        >
                            <textarea
                                id="text"
                                name="msg"
                                placeholder="Type your medical question..."
                                autocomplete="off"
                                class="form-control type_msg"
                                rows="1"
                                required
                            ></textarea>

                            <div class="input-group-append">
                                <button
                                    type="submit"
                                    id="send"
                                    class="input-group-text send_btn"
                                    aria-label="Send message"
                                >
                                    <i class="fas fa-location-arrow"></i>
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <script>
        $(document).ready(function () {
            const chatHistory = [];

            const doctorImage =
                "https://cdn-icons-png.flaticon.com/512/387/387569.png";

            const userImage =
                "https://i.ibb.co/d5b84Xw/Untitled-design.png";

            const messageInput =
                document.getElementById("text");


            function resizeMessageInput() {
                messageInput.style.height = "auto";

                const maximumHeight = 140;

                messageInput.style.height =
                    Math.min(
                        messageInput.scrollHeight,
                        maximumHeight
                    ) + "px";

                messageInput.style.overflowY =
                    messageInput.scrollHeight > maximumHeight
                        ? "auto"
                        : "hidden";
            }


            function currentTime() {
                const date = new Date();

                return (
                    String(date.getHours()).padStart(2, "0") +
                    ":" +
                    String(date.getMinutes()).padStart(2, "0")
                );
            }


            function scrollToBottom() {
                const messageArea =
                    document.getElementById("messageFormeight");

                messageArea.scrollTop =
                    messageArea.scrollHeight;
            }


            function appendUserMessage(message) {
                const wrapper = $("<div>").addClass(
                    "d-flex justify-content-end mb-4"
                );

                const bubble = $("<div>")
                    .addClass("msg_cotainer_send")
                    .text(message);

                const time = $("<span>")
                    .addClass("msg_time_send")
                    .text(currentTime());

                const imageContainer = $("<div>").addClass(
                    "img_cont_msg"
                );

                const image = $("<img>", {
                    src: userImage,
                    alt: "User",
                }).addClass(
                    "rounded-circle user_img_msg"
                );

                bubble.append(time);
                imageContainer.append(image);

                wrapper.append(
                    bubble,
                    imageContainer
                );

                $("#messageFormeight").append(
                    wrapper
                );

                scrollToBottom();
            }


            function appendBotMessage(
                message,
                sources = []
            ) {
                const wrapper = $("<div>").addClass(
                    "d-flex justify-content-start mb-4"
                );

                const imageContainer = $("<div>").addClass(
                    "img_cont_msg"
                );

                const image = $("<img>", {
                    src: doctorImage,
                    alt: "Medical assistant",
                }).addClass(
                    "rounded-circle user_img_msg"
                );

                const bubble = $("<div>").addClass(
                    "msg_cotainer"
                );

                const answerText = $("<div>")
                    .addClass("bot_answer")
                    .text(message);

                const time = $("<span>")
                    .addClass("msg_time")
                    .text(currentTime());

                bubble.append(answerText);

                if (sources.length > 0) {
                    const sourcesContainer =
                        $("<div>").addClass(
                            "source_container mt-3"
                        );

                    const sourcesTitle =
                        $("<div>")
                            .addClass("source_title")
                            .text("Sources:");

                    sourcesContainer.append(
                        sourcesTitle
                    );

                    sources.forEach(function (source) {
                        const sourceItem =
                            $("<div>").addClass(
                                "source_item"
                            );

                        const sourceName =
                            source.source ||
                            "Medical source";

                        const sourceTitle =
                            source.title ||
                            "Medical topic";

                        if (source.url) {
                            const sourceLink =
                                $("<a>", {
                                    href: source.url,
                                    target: "_blank",
                                    rel: "noopener noreferrer",
                                    text:
                                        sourceName +
                                        " – " +
                                        sourceTitle,
                                });

                            sourceItem.append(
                                sourceLink
                            );
                        } else {
                            sourceItem.text(
                                sourceName +
                                " – " +
                                sourceTitle
                            );
                        }

                        sourcesContainer.append(
                            sourceItem
                        );
                    });

                    bubble.append(
                        sourcesContainer
                    );
                }

                bubble.append(time);
                imageContainer.append(image);

                wrapper.append(
                    imageContainer,
                    bubble
                );

                $("#messageFormeight").append(
                    wrapper
                );

                scrollToBottom();
            }


            function appendThinkingMessage() {
                const thinking = $("<div>")
                    .attr("id", "thinking-message")
                    .addClass(
                        "d-flex justify-content-start mb-4"
                    );

                const bubble = $("<div>")
                    .addClass("msg_cotainer")
                    .text("Thinking...");

                thinking.append(bubble);

                $("#messageFormeight").append(
                    thinking
                );

                scrollToBottom();
            }


            $("#text").on(
                "input",
                resizeMessageInput
            );


            $("#text").on(
                "keydown",
                function (event) {
                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {
                        event.preventDefault();

                        $("#messageArea").trigger(
                            "submit"
                        );
                    }
                }
            );


            $("#messageArea").on(
                "submit",
                function (event) {
                    event.preventDefault();

                    const rawText =
                        $("#text").val().trim();

                    if (!rawText) {
                        return;
                    }

                    appendUserMessage(rawText);

                    $("#text")
                        .val("")
                        .prop("disabled", true);

                    resizeMessageInput();

                    $("#send").prop(
                        "disabled",
                        true
                    );

                    appendThinkingMessage();

                    const previousHistory = [
                        ...chatHistory
                    ];

                    $.ajax({
                        url: "/get",
                        type: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({
                            msg: rawText,
                            history: previousHistory,
                        }),
                    })
                    .done(function (response) {
                        $("#thinking-message").remove();

                        const answer =
                            response.answer ||
                            "I could not generate an answer.";

                        appendBotMessage(
                            answer,
                            response.sources || []
                        );

                        if (
                            response.reset_history === true
                        ) {
                            chatHistory.length = 0;
                        }

                        chatHistory.push({
                            role: "user",
                            content: rawText,
                        });

                        chatHistory.push({
                            role: "assistant",
                            content: answer,
                        });
                    })
                    .fail(function () {
                        $("#thinking-message").remove();

                        appendBotMessage(
                            "The medical assistant is temporarily unavailable. Please try again."
                        );
                    })
                    .always(function () {
                        $("#text")
                            .prop("disabled", false)
                            .focus();

                        $("#send").prop(
                            "disabled",
                            false
                        );

                        resizeMessageInput();
                    });
                }
            );


            resizeMessageInput();
        });
    </script>
</body>
</html>
